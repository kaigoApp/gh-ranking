name: 第三者評価の取得

on:
  push:
    branches: [main, hyoka]
    paths: [scripts/probe_hyoka.py, scripts/fetch_hyoka.py, .github/workflows/hyoka.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 第三者評価を受けた事業所を取得
        run: python -u scripts/fetch_hyoka.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hyoka
          git diff --cached --quiet || (git commit -m "第三者評価を取得" && git push)
