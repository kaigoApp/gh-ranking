name: データ取得とページ更新

on:
  push:
    branches: [main]
  schedule:
    # 毎月1日と15日の 9:17（日本時間）。新しい時点が出ていれば取り込む
    - cron: "17 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WAM NET から最新データを取得
        run: python scripts/fetch.py
        timeout-minutes: 60

      - name: 新しく取得したデータを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slim
          if git diff --cached --quiet; then
            echo "新しいデータはありません"
          else
            git commit -m "データ追加: $(git diff --cached --name-only | wc -l | tr -d ' ') ファイル"
            git push
          fi

      - name: ページを作成
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
