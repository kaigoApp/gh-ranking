name: データ取得とページ更新

on:
  push:
    branches: [main]
  schedule:
    # 毎月1日と15日の 9:17（日本時間）。新しい時点が出ていれば取り込む
    - cron: "17 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WAM NET から最新データを取得
        run: python scripts/fetch.py
        timeout-minutes: 60

      - name: 市区町村別の人口を取得（総務省、未取得のときだけ）
        run: python scripts/fetch_pop.py
        timeout-minutes: 10

      - name: 新しく取得したデータを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/slim
          git add data/pop.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "新しいデータはありません"
          else
            git commit -m "データ追加: $(git diff --cached --name-only | wc -l | tr -d ' ') ファイル"
            git push
          fi

      - name: シェア用画像の道具とフォントを用意
        run: |
          pip install pillow==12.3.0
          mkdir -p .fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o .fonts/ZenMaruGothic-Black.ttf $base/zenmarugothic/ZenMaruGothic-Black.ttf
          curl -fsSL -o .fonts/ZenMaruGothic-Bold.ttf $base/zenmarugothic/ZenMaruGothic-Bold.ttf
          curl -fsSL -o .fonts/BarlowSemiCondensed-Bold.ttf $base/barlowsemicondensed/BarlowSemiCondensed-Bold.ttf
        continue-on-error: true

      - name: ページを作成
        run: python scripts/build.py
        env:
          SITE_URL: https://jimofuku.jp

      - name: エックスサーバーへアップロード
        env:
          SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
          USER: ${{ secrets.XSERVER_USER }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
        run: |
          # 事業所ページを全サービスに広げてから GitHub Pages の上限（1GB）を超えるので、公開先はエックスサーバーだけ
          if [ -z "$SSH_KEY" ]; then
            echo "鍵が登録されていないので、アップロードできません"
            exit 1
          fi
          install -m 600 /dev/null ~/xserver_key
          printf '%s\n' "$SSH_KEY" > ~/xserver_key
          mkdir -p ~/.ssh
          ssh-keyscan -p 10022 "$HOST" >> ~/.ssh/known_hosts
          # 変わったファイルだけ送り、無くなったページはサーバーからも消す（サーバーの設定ファイルは残す）
          rsync -rlz --checksum --delete --exclude .htaccess --exclude .user.ini \
            -e "ssh -p 10022 -i ~/xserver_key" \
            public/ "$USER@$HOST:jimofuku.jp/public_html/"
          # お問い合わせの届け先を、公開フォルダの外に置く（ページからは見えない）
          if [ -n "$CONTACT_TO" ]; then
            printf '%s\n' "$CONTACT_TO" | ssh -p 10022 -i ~/xserver_key "$USER@$HOST" \
              'umask 077 && cat > jimofuku.jp/contact_to.txt'
          else
            echo "お問い合わせの届け先（CONTACT_TO）が未登録なので、フォームは「受け付けていません」と表示します"
          fi
