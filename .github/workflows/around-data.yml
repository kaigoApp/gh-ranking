name: くらしのまわりのデータ（病院・役所・お店）

on:
  push:
    branches: [gh-around]
    paths: [scripts/fetch_around.py, .github/workflows/around-data.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyshp==2.3.1 && sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: 病院・役所・お店の位置を取得
        run: python scripts/fetch_around.py
      - name: 保存
        run: |
          ls -la data/around
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/around/poi.csv.gz data/around/layout.txt
          git diff --cached --quiet || (git commit -m "くらしのまわりのデータを取得" && git push)
